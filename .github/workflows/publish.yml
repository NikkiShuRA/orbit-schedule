# Fetches schedules on a timer, commits real changes to the data branch
# and publishes the data to GitHub Pages. See ADR 0004.
#
# This file is a thin wrapper around `orbit fetch`: all logic lives in
# the CLI, so the same thing can run on any server with cron.
name: Publish

on:
  schedule:
    # Times are UTC; Surgut is UTC+5. Minutes avoid the busy top of the
    # hour, when GitHub delays and drops scheduled runs the most.
    - cron: "3-59/10 2-15 * * *" # every 10 minutes, 07:00-21:00 in Surgut
    - cron: "17 0,1,16-23 * * *" # hourly at night
    - cron: "43 2 * * 1" # weekly keepalive, see the keepalive job
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/publish.yml"]

# Nothing by default; each job asks for what it needs.
permissions: {}

# Never run two publishes at once: both would push to the data branch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    # Only main publishes. Runs from other branches and PRs are dry runs:
    # they fetch and validate, but push and deploy nothing.
    if: github.event_name != 'schedule' || github.event.schedule != '43 2 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the data branch
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      site: ${{ steps.pages.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/app/package-lock.json

      - name: Build orbit
        working-directory: code
        run: go build -trimpath -o "$RUNNER_TEMP/orbit" ./cmd/orbit

      # The app (ADR 0010) is built from the same commit and served from
      # the root of the site, next to the data in api/v1.
      - name: Build the app
        working-directory: code/app
        run: |
          npm ci
          npm run build

      # Sources are independent: one being down must not stop the others
      # from being published. A failed source still fails the job at the
      # end ("Fail if a source failed"), so the failure is not missed.
      - name: Fetch SIEUiP
        id: sieup
        continue-on-error: true
        run: |
          set +e
          "$RUNNER_TEMP/orbit" fetch sieup --out data --weeks 2
          code=$?
          # 3 means nothing is published yet: not a failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Fetch SPK
        id: spk
        continue-on-error: true
        run: |
          set +e
          "$RUNNER_TEMP/orbit" fetch spk --out data --weeks 2
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Commit changes
        if: env.PUBLISH == 'true'
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          changes="$(git diff --cached --name-status)"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update schedules" -m "$changes"
          git push

      # The data is a static API; its path carries the version of the
      # contract (ADR 0008). A breaking change publishes api/v2 next to
      # api/v1 instead of changing this path. The description of the API
      # (ADR 0009) is published with it, from the commit being run, so
      # it always matches the orbit that wrote the files. The README of
      # the data branch describes the branch, not the API: left out.
      - name: Assemble the site
        env:
          API: _site/api/v1
        run: |
          mkdir -p "$API"
          cp -R code/app/dist/. _site/
          rsync -a --exclude='.git*' --exclude='/README.md' data/ "$API/"
          "$RUNNER_TEMP/orbit" slice --in data --out "$API"
          cp code/api/v1/openapi.json "$API/"
          mkdir -p "$API/schemas"
          cp code/api/v1/schemas/*.schema.json "$API/schemas/"
          find "$API" -maxdepth 2 -type f | sort
          echo "$(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v5
        id: pages
        if: env.PUBLISH == 'true'
        with:
          path: _site

      - name: Fail if a source failed
        if: steps.sieup.outcome == 'failure' || steps.spk.outcome == 'failure'
        run: |
          echo "::error::SIEUiP: ${{ steps.sieup.outcome }}, SPK: ${{ steps.spk.outcome }}"
          exit 1

  deploy:
    needs: fetch
    # Deploy whatever was assembled, even if one source failed: the other
    # sources' fresh data should not wait for it.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.fetch.outputs.site != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows in a repository with no activity
  # for 60 days, which would happen every summer break. Re-enabling the
  # workflow through the API resets that timer without dummy commits.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '43 2 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

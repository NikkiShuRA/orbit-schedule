name: Ошибка
description: Что-то работает не так, как должно
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issue видят все. Не прикладывайте токены, пароли, личные данные и выгрузки с ними.
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы сделали, что ожидали и что получили.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. go run ./cmd/orbit fetch sieup --out data --date 2026-11-09
        2. ...
  - type: dropdown
    id: area
    attributes:
      label: Где
      options: [Стандарт данных, Коннектор, Приложение, CI и инфраструктура, Не знаю]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Окружение
      description: ОС, версии Go/Node, версия коннектора — если важно.

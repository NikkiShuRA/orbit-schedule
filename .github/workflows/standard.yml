name: Standard

on:
  push:
    branches: [main]
    paths: ["standard/**", ".github/workflows/standard.yml"]
  # No path filter on pull requests: "validate" is a required check in
  # the main branch ruleset, and a filtered-out run never reports, which
  # would leave unrelated PRs waiting forever.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standard/package-lock.json
      - run: npm ci
      - run: npm test

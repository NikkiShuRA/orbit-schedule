name: Предложение
description: Новая возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Кому и в какой ситуации это нужно.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Что предлагается
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Другие варианты

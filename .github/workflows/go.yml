name: Go

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "internal/**", "cmd/**", "standard/**", ".github/workflows/go.yml"]
  # No path filter on pull requests: "test" and "vulncheck" are required
  # checks in the main branch ruleset, and a filtered-out run never
  # reports, which would leave unrelated PRs waiting forever.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/orbit

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

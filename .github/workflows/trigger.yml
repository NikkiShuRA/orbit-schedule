# Tests the publish timer worker in ops/trigger (ADR 0011).
# Deploying it is manual (see ops/trigger/README.md): CI holds no
# Cloudflare credentials.
name: Trigger

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ops/trigger
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
